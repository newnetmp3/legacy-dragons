name: Release
# Publishes the module when module.json gets a new version on main: a GitHub
# release "v<version>" holding legacy-dragons.zip and module.json. Foundry finds
# it through the manifest URL in module.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [module.json]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('module.json'))['version'])")"
          grep -q "releases/download/v$VERSION/legacy-dragons.zip" module.json || { echo "module.json download URL doesn't match version $VERSION"; exit 1; }
          zip -r legacy-dragons.zip module.json README.md LICENSE packs tokens -x 'packs/*/LOCK' 'packs/*/LOG*'
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" legacy-dragons.zip module.json --target "$GITHUB_SHA" \
            --title "Legacy Dragons v$VERSION" \
            --notes "Install in Foundry: Add-on Modules → Install Module → paste https://raw.githubusercontent.com/newnetmp3/legacy-dragons/main/module.json"
